<!-- 문구는 src/i18n 사전에서 채운다: data-i18n(본문) · data-i18n-title(툴팁) · data-icon(Lucide 아이콘) -->
<div class="app">
  <header class="topbar">
    <div class="top-l">
      <button class="brand" id="homeBtn" data-i18n-title="top.home">
        <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9"/><path d="M8 15.5 16 9l8 6.5V24h-5v-5h-6v5H8z"/></svg>
        <span class="brand-t"><b data-i18n="app.brand"></b><small id="brandSub"></small></span>
      </button>
      <div class="seg" id="typeSeg" role="tablist"></div>
    </div>
    <div class="seg seg-view" id="viewSeg" role="tablist">
      <button class="btn" data-view="3d" data-icon="view3d"><span data-i18n="view.tour"></span></button>
      <button class="btn" data-view="2d" data-icon="plan2d"><span data-i18n="view.plan"></span></button>
      <button class="btn" data-view="walk" data-icon="walk"><span data-i18n="view.walk"></span></button>
    </div>
    <div class="top-r">
    <div class="seg seg-unit" id="unitSeg" role="tablist" data-i18n-title="unit.title">
      <button class="btn" data-mirror="0"><span data-i18n="unit.base"></span></button>
      <button class="btn" data-mirror="1" data-icon="flip"><span data-i18n="unit.mirror"></span></button>
    </div>
    <div class="top-tools">
      <button class="btn icon" id="undo" data-i18n-title="tb.undo" data-icon="undo"></button>
      <button class="btn icon" id="redo" data-i18n-title="tb.redo" data-icon="redo"></button>
      <button class="btn icon" id="fullscreen"></button>
      <details class="menu"><summary class="btn icon" data-i18n-title="tb.more" data-icon="more"></summary>
        <div class="menu-pop">
          <button class="btn" id="exportPng" data-icon="image"><span data-i18n="tb.exportPng"></span></button>
          <button class="btn" id="exportJson" data-icon="download"><span data-i18n="tb.exportJson"></span></button>
          <button class="btn" id="importJson" data-icon="upload"><span data-i18n="tb.importJson"></span></button>
          <hr>
          <button class="btn" id="restage" data-icon="reset"><span data-i18n="tb.restage"></span></button>
          <button class="btn danger" id="clearAll" data-icon="eraser"><span data-i18n="tb.clear"></span></button>
        </div></details>
    </div>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </header>

  <main id="stage">
    <svg id="plan" class="tool-select" font-family="'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">

      <g id="gGrid"></g>
      <g id="gRooms"></g>
      <g id="gFix" pointer-events="none"></g>
      <g id="gFurn"></g>
      <g id="gWalls" pointer-events="none"></g>
      <g id="gOpen" pointer-events="none"></g>
      <g id="gLabels" pointer-events="none"></g>
      <g id="gDims" pointer-events="none"></g>
      <g id="gMeasure" pointer-events="none"></g>
      <g id="gSel"></g>
      <g id="gEdit"></g>
    </svg>
    <div id="view3d">
      <div id="walkOverlay"><div class="card"><h3 data-i18n="v3d.walkTitle"></h3>
        <p id="wo1"></p>
        <p id="wo2"></p>
        <p id="wo3"></p></div></div>
      <div id="cross"></div>
      <div id="joy"><i></i></div>
      <button class="btn primary" id="walkExit" data-icon="close"><span data-i18n="v3d.walkExit"></span></button>
    </div>

    <!-- 화면 위 정보·도구 -->
    <div class="stage-info" id="stageInfo"></div>
    <div class="float-tools only2d" id="tools2d">
      <div class="grp hide-editing">
        <button class="btn on" data-tool="select" data-i18n-title="tb.selectTitle" data-icon="select"><span data-i18n="tb.select"></span></button>
        <button class="btn" data-tool="measure" data-i18n-title="tb.measureTitle" data-icon="measure"><span data-i18n="tb.measure"></span></button>
        <button class="btn" id="clearMeasures" hidden data-i18n-title="tb.clearMeasuresTitle" data-icon="eraser"><span data-i18n="tb.clearMeasures"></span></button>
      </div>
      <div class="grp hide-editing" id="layers">
        <button class="btn chip on" data-layer="dims" data-i18n="tb.layerDims"></button>
        <button class="btn chip on" data-layer="labels" data-i18n="tb.layerRooms"></button>
        <button class="btn chip on" data-layer="furn" data-i18n="tb.layerFurn"></button>
        <button class="btn chip" data-layer="bearing" data-i18n="tb.layerBearing" data-i18n-title="tb.layerBearingTitle"></button>
        <button class="btn chip" data-layer="grid" data-i18n="tb.layerGrid"></button>
      </div>
      <div class="grp">
        <button class="btn icon" id="zoomOut" data-i18n-title="tb.zoomOut" data-icon="zoomOut"></button>
        <button class="btn icon" id="zoomIn" data-i18n-title="tb.zoomIn" data-icon="zoomIn"></button>
        <button class="btn icon" id="fit" data-i18n-title="tb.fitTitle" data-icon="fit"></button>
      </div>
      <div class="grp">
        <button class="btn" id="edPlan" data-i18n-title="tb.editPlanTitle" data-icon="edit"><span data-i18n="tb.editPlan"></span></button>
      </div>
    </div>
    <div class="float-tools right only3d" id="tools3d">
      <div class="grp"><label class="range" data-icon="sun"><input type="range" id="sun" min="6" max="20" step=".25" value="11" data-i18n-title="tb.sun"><span id="sunT">11:00</span></label>
        <select id="sunDay" class="sun-day" data-i18n-title="tb.sunDay"><option value="today" data-i18n="sun.today"></option><option value="equinox" data-i18n="sun.equinox"></option><option value="summer" data-i18n="sun.summer"></option><option value="winter" data-i18n="sun.winter"></option></select></div>
      <div class="grp">
        <button class="btn chip" data-t="night" data-icon="moon"><span data-i18n="tb.t3dNight"></span></button>
        <button class="btn chip" data-t="cut" data-icon="cut"><span data-i18n="tb.cutLow"></span></button>
        <button class="btn chip on" data-t="furn" data-icon="furniture"><span data-i18n="tb.t3dFurn"></span></button>
        <button class="btn chip on" data-t="labels" data-icon="info"><span data-i18n="tb.t3dLabels"></span></button>
      </div>
    </div>
    <div id="hint3d" class="only3d"></div>
    <div id="minimap" class="only3d" data-i18n-title="map.title"></div>
    <div id="compass" hidden><svg viewBox="-30 -30 60 60" aria-hidden="true"><circle r="27"/><g class="needle"><path class="n" d="M0 -21 L6 0 L-6 0Z"/><path class="s" d="M0 21 L6 0 L-6 0Z"/><text y="-11.5">N</text></g></svg><span id="compassLabel"></span></div>
    <nav id="roomTabs" aria-label="rooms"></nav>
    <div class="scalebar only2d" id="scalebar"><span id="sbText">1 m</span><div class="bar" id="sbBar"></div></div>
    <div class="modehint" id="modehint"></div>
    <div id="fab"></div>
    <div id="tourCard" hidden></div>
  </main>

  <aside id="side">
    <div class="side-tabs" role="tablist">
      <button class="tab" data-tab="options" data-icon="options"><span data-i18n="tab.options"></span></button>
      <button class="tab" data-tab="style" data-icon="palette"><span data-i18n="tab.style"></span></button>
      <button class="tab" data-tab="furniture" data-icon="furniture"><span data-i18n="tab.furniture"></span></button>
    </div>
    <div id="sidePanel"></div>
  </aside>

  <footer id="estimateBar"></footer>
</div>

<div id="landing" hidden></div>
<div id="summary" class="modal" hidden></div>
<div id="toast" role="status"></div>
</body>
